[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amplisentinel"
version = "0.1.0"
description = "Auditable experiment manager for multi-run amplicon processing. Reports data, never opinions."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Tassiane Anzolin" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "mcp>=2.3"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
