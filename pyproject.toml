[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amplisentinel"
version = "0.2.0"
description = "Auditable experiment manager for multi-run amplicon processing. Reports data, never opinions."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Tassiane Anzolin" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/tassid/amplisentinel"
Repository = "https://github.com/tassid/amplisentinel"
Issues = "https://github.com/tassid/amplisentinel/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
ml = ["scikit-bio>=0.6", "scikit-learn>=1.4", "shap>=0.45", "mlflow>=2.12"]
dev = ["pytest>=8", "ruff>=0.8", "mcp>=2.3", "scikit-bio>=0.6", "scikit-learn>=1.4", "shap>=0.45", "mlflow>=2.12"]

[project.scripts]
amplisentinel = "amplisentinel.cli:main"

[tool.setuptools.packages.find]
include = ["amplisentinel*"]

[tool.setuptools.package-data]
amplisentinel = ["assets/*.svg"]
